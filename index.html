<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SmartPrint by AppDIGI</title>


    <!-- =========================================
         PWA
    ========================================== -->

    <link
        rel="manifest"
        href="./manifest.json">

    <meta
        name="theme-color"
        content="#2563eb">


    <!-- =========================================
         ICON
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        href="./assets/logo.png">


    <!-- =========================================
         CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="./css/style.css">

    <link
        rel="stylesheet"
        href="./css/responsive.css">

</head>


<body>


<!-- =================================================
     TOPBAR
================================================= -->

<header class="topbar">


    <div class="logo-area">

        <img
            src="./assets/logo.png"
            id="logo"
            alt="SmartPrint Logo">


        <div>

            <h1>
                SmartPrint
            </h1>

            <span>
                by AppDIGI
            </span>

        </div>

    </div>


    <div class="status">

        <span class="dot"></span>

        <span id="printerStatus">
            No Printer
        </span>

    </div>


</header>



<!-- =================================================
     MAIN CONTAINER
================================================= -->

<div class="container">


    <!-- =============================================
         SIDEBAR
    ============================================== -->

    <aside class="sidebar">


        <button
            class="menu active"
            id="homeBtn"
            type="button">

            🏠 Home

        </button>


        <button
            class="menu"
            id="fileBtn"
            type="button">

            📄 File

        </button>


        <button
            class="menu"
            id="labelBtn"
            type="button">

            🏷 Label

        </button>


        <button
            class="menu"
            id="barcodeBtn"
            type="button">

            📊 Barcode

        </button>


        <button
            class="menu"
            id="qrBtn"
            type="button">

            ⬛ QR Code

        </button>


        <!-- =========================================
             INSTALL APP
        ========================================== -->

        <button
            class="menu install-btn"
            id="installBtn"
            type="button"
            hidden>

            📲 Install App

        </button>


        <button
            class="menu"
            id="settingBtn"
            type="button">

            ⚙ Settings

        </button>


    </aside>



    <!-- =============================================
         WORKSPACE
    ============================================== -->

    <main class="workspace">


        <section class="preview-card">


            <h2>
                Preview
            </h2>


            <!-- =====================================
                 PREVIEW TOOLBAR
            ====================================== -->

            <div class="toolbar">


                <button
                    id="zoomOut"
                    type="button"
                    title="Zoom Out">

                    −

                </button>


                <span id="zoomValue">
                    100%
                </span>


                <button
                    id="zoomIn"
                    type="button"
                    title="Zoom In">

                    +

                </button>


                <button
                    id="actualSizeBtn"
                    type="button"
                    title="Ukuran Asli">

                    100%

                </button>


                <button
                    id="fitBtn"
                    type="button"
                    title="Fit">

                    Fit

                </button>


                <button
                    id="fitWidthBtn"
                    type="button"
                    title="Fit Width">

                    ↔

                </button>


                <button
                    id="fitHeightBtn"
                    type="button"
                    title="Fit Height">

                    ↕

                </button>


                <button
                    id="rotateLeftBtn"
                    type="button"
                    title="Rotate Left">

                    ↶ 90°

                </button>


                <button
                    id="rotateRightBtn"
                    type="button"
                    title="Rotate Right">

                    ↷ 90°

                </button>


                <button
                    id="resetPreviewBtn"
                    type="button"
                    title="Reset Preview">

                    Reset

                </button>


            </div>



            <!-- =====================================
                 PREVIEW
            ====================================== -->

            <div id="preview">

                <div class="preview-empty">

                    Drop PDF / Image Here

                </div>

            </div>



            <!-- =====================================
                 FILE
            ====================================== -->

            <div class="file-area">


                <button
                    id="uploadBtn"
                    type="button">

                    📂 Pilih File

                </button>


                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,.pdf">


                <button
                    id="clearFileBtn"
                    type="button">

                    🗑 Clear

                </button>


            </div>


        </section>


    </main>



    <!-- =============================================
         PRINTER PANEL
    ============================================== -->

    <aside class="panel">


        <h2>
            Printer
        </h2>


        <!-- MODE -->

        <label for="printMode">
            Mode
        </label>


        <select id="printMode">

            <option value="escpos">
                ESC/POS
            </option>

            <option value="tspl">
                TSPL
            </option>

        </select>



        <!-- PRINTER TYPE -->

        <label for="printerType">
            Printer Type
        </label>


        <select id="printerType">

            <option value="receipt58">
                Receipt 58mm
            </option>

            <option value="receipt80">
                Receipt 80mm
            </option>

            <option value="label">
                Label Printer
            </option>

        </select>



        <!-- PAPER -->

        <label for="paperSize">
            Paper Size
        </label>


        <select id="paperSize">

            <option value="58">
                58mm
            </option>

            <option value="80">
                80mm
            </option>

            <option value="40x30">
                40 × 30 mm
            </option>

            <option value="50x30">
                50 × 30 mm
            </option>

            <option value="60x40">
                60 × 40 mm
            </option>

            <option value="80x50">
                80 × 50 mm
            </option>

            <option
                value="100x150"
                selected>

                100 × 150 mm

            </option>

        </select>



        <!-- DENSITY -->

        <label for="density">
            Density
        </label>


        <input
            id="density"
            type="range"
            min="1"
            max="15"
            value="8">


        <span id="densityValue">
            8
        </span>



        <!-- COPIES -->

        <label for="copies">
            Copies
        </label>


        <input
            id="copies"
            type="number"
            value="1"
            min="1">



        <!-- BUTTONS -->

        <div class="buttons">


            <button
                id="connectBtn"
                type="button">

                🔵 Connect Printer

            </button>


            <button
                id="printBtn"
                type="button">

                🖨 Print

            </button>


        </div>


    </aside>


</div>



<!-- =================================================
     MOBILE NAV
================================================= -->

<nav class="bottom-nav">


    <button
        id="navHome"
        type="button">

        🏠

    </button>


    <button
        id="navFile"
        type="button">

        📄

    </button>


    <button
        id="navLabel"
        type="button">

        🏷

    </button>


    <button
        id="navQR"
        type="button">

        ⬛

    </button>


    <button
        id="navSetting"
        type="button">

        ⚙

    </button>


</nav>



<!-- =================================================
     CORE
================================================= -->



<script src="./js/image.js"></script>



<!-- =================================================
     PDF.JS
================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

if (typeof pdfjsLib !== "undefined") {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

}

</script>



<!-- =================================================
     SMARTPRINT ENGINE
================================================= -->

<script src="./js/pdf.js"></script>

<script src="js/bluetooth.js"></script>

<script src="js/settings.js"></script>

<script src="js/printer.js"></script>

<script src="js/escpos.js"></script>
<script src="js/tspl.js"></script>
<script src="js/zpl.js"></script>
<script src="js/cpcl.js"></script>

<script src="js/preview.js"></script>
<script src="js/barcode.js"></script>

<script src="js/app.js"></script>



<!-- =================================================
     PWA INSTALL
================================================= -->

<script src="./js/install.js"></script>



<!-- =================================================
     PREVIEW CONTROLS
================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const bind = (
            id,
            action
        ) => {

            const element =
                document.getElementById(id);


            if (!element) {

                console.warn(
                    "Element tidak ditemukan:",
                    id
                );

                return;

            }


            element.addEventListener(
                "click",
                action
            );

        };



        /* ZOOM OUT */

        bind(
            "zoomOut",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.zoomOut();

                }

            }
        );



        /* ZOOM IN */

        bind(
            "zoomIn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.zoomIn();

                }

            }
        );



        /* ACTUAL SIZE */

        bind(
            "actualSizeBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    if (
                        typeof Preview.actualSize ===
                        "function"
                    ) {

                        Preview.actualSize();

                    }

                }

            }
        );



        /* FIT */

        bind(
            "fitBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.fit();

                }

            }
        );



        /* FIT WIDTH */

        bind(
            "fitWidthBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.fitWidth();

                }

            }
        );



        /* FIT HEIGHT */

        bind(
            "fitHeightBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.fitHeight();

                }

            }
        );



        /* ROTATE LEFT */

        bind(
            "rotateLeftBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.rotateLeft();

                }

            }
        );



        /* ROTATE RIGHT */

        bind(
            "rotateRightBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.rotateRight();

                }

            }
        );



        /* RESET */

        bind(
            "resetPreviewBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.clearPreview();

                }


                const input =
                    document.getElementById(
                        "fileInput"
                    );


                if (input) {

                    input.value = "";

                }

            }
        );



        /* CLEAR FILE */

        bind(
            "clearFileBtn",
            () => {

                if (
                    typeof Preview !==
                    "undefined"
                ) {

                    Preview.clearPreview();

                }


                const input =
                    document.getElementById(
                        "fileInput"
                    );


                if (input) {

                    input.value = "";

                }

            }
        );



        /* DENSITY */

        const density =
            document.getElementById(
                "density"
            );


        const densityValue =
            document.getElementById(
                "densityValue"
            );


        if (
            density &&
            densityValue
        ) {

            density.addEventListener(
                "input",
                function () {

                    densityValue.textContent =
                        this.value;

                }
            );

        }


        console.log(
            "SmartPrint Preview Controls Ready"
        );


    }
);

</script>



</body>

</html>
