<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SmartPrint by AppDIGI</title>


<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">


<link rel="icon" href="assets/logo.png">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/responsive.css">


</head>


<body>


<header class="topbar">


<div class="logo-area">

<img src="assets/logo.png" id="logo">


<div>

<h1>SmartPrint</h1>

<span>by AppDIGI</span>

</div>


</div>



<div class="status">

<span class="dot"></span>

<span id="printerStatus">
No Printer
</span>

</div>


</header>




<div class="container">



<aside class="sidebar">


<button class="menu active" id="homeBtn">

🏠 Home

</button>



<button class="menu" id="fileBtn">

📄 File

</button>



<button class="menu" id="labelBtn">

🏷 Label

</button>



<button class="menu" id="barcodeBtn">

📊 Barcode

</button>



<button class="menu" id="qrBtn">

⬛ QR Code

</button>

<button id="installBtn" style="display:none">
    📲 Install App
</button>

<button class="menu" id="settingBtn">

⚙ Settings

</button>


</aside>






<main class="workspace">



<section class="preview-card">


<h2>Preview</h2>



<div class="toolbar">


<button id="zoomOut">
-
</button>


<span id="zoomValue">
100%
</span>


<button id="zoomIn">
+
</button>


</div>



<div id="preview">


Drop PDF / Image Here


</div>



<input 
type="file"
id="fileInput"
accept="image/*,.pdf">



</section>


</main>






<aside class="panel">


<h2>Printer</h2>



<label>
Mode
</label>


<select id="printMode">

<option value="escpos">
ESC/POS
</option>


<option value="tspl">
TSPL
</option>


</select>





<label>
Printer Type
</label>


<select id="printerType">


<option>
Receipt 58mm
</option>


<option>
Receipt 80mm
</option>


<option>
Label Printer
</option>


</select>





<label>
Paper Size
</label>


<select id="paperSize">


<option value="58">
58mm
</option>


<option value="80">
80mm
</option>


<option>
40x30 mm
</option>


<option>
50x30 mm
</option>


<option>
60x40 mm
</option>


<option>
80x50 mm
</option>


<option selected>
100x150 mm
</option>


</select>






<label>
Density
</label>


<input 
id="density"
type="range"
min="1"
max="15"
value="8">





<label>
Copies
</label>


<input
id="copies"
type="number"
value="1"
min="1">





<div class="buttons">


<button id="connectBtn">

🔵 Connect Printer

</button>




<button id="printBtn">

🖨 Print

</button>



</div>



</aside>


</div>






<nav class="bottom-nav">


<button id="navHome">
🏠
</button>


<button id="navFile">
📄
</button>


<button id="navLabel">
🏷
</button>


<button id="navQR">
⬛
</button>


<button id="navSetting">
⚙
</button>


</nav>





<!-- Printer Engine -->

<script src="js/settings.js"></script>

<script src="js/preview.js"></script>

<script src="js/image.js"></script>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<!-- SmartPrint PDF Engine -->
<script src="js/pdf.js"></script>

<script src="js/barcode.js"></script>

<script src="js/qrcode.js"></script>

<script src="js/label.js"></script>

<script src="js/bluetooth.js"></script>

<script src="js/escpos.js"></script>

<script src="js/tspl.js"></script>

<script src="js/zpl.js"></script>

<script src="js/cpcl.js"></script>

<script src="js/printer.js"></script>
  
<script src="js/install.js"></script>
  
<script src="js/app.js"></script>


</body>

</html>
