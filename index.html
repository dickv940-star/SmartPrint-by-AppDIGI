<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAWbt by AppDIGI</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="topbar">

<div class="logo-area">

<img src="assets/logo.png"
id="logo">

<div>

<h1>RAWbt</h1>

<span>by AppDIGI</span>

</div>

</div>

<div class="status">

<span class="dot"></span>

<span id="printerStatus">

No Printer

</span>

</div>

</header>

<div class="container">

<aside class="sidebar">

<button class="menu active">

🏠 Home

</button>

<button class="menu">

📄 Print

</button>

<button class="menu">

🏷 Label

</button>

<button class="menu">

📊 Barcode

</button>

<button class="menu">

⬛ QR Code

</button>

<button class="menu">

⚙ Settings

</button>

</aside>

<main class="workspace">

<section class="preview-card">

<h2>Preview</h2>

<div id="preview">

Drop PDF / Image Here

</div>

</section>

</main>

<aside class="panel">

<h2>Printer</h2>

<label>

Printer Type

</label>

<select id="printerType">

<option>

Receipt 58mm

</option>

<option>

Receipt 80mm

</option>

<option>

Label Printer

</option>

</select>

<label>

Paper Size

</label>

<select id="paperSize">

<option>

58mm

</option>

<option>

80mm

</option>

<option>

40x30 mm

</option>

<option>

50x30 mm

</option>

<option>

60x40 mm

</option>

<option>

80x50 mm

</option>

<option selected>

100x150 mm

</option>

</select>

<label>

Density

</label>

<input
type="range"
min="1"
max="15"
value="8">

<label>

Copies

</label>

<input
type="number"
value="1">

<div class="buttons">

<button id="connectBtn">

Connect Printer

</button>

<button id="printBtn">

Print

</button>

</div>

</aside>

</div>

<nav class="bottom-nav">

<button>

🏠

</button>

<button>

📄

</button>

<button>

🏷

</button>

<button>

📊

</button>

<button>

⚙

</button>

</nav>

<script src="js/app.js"></script>

</body>

</html>
